<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monologue</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="/assets/Monologue-icon.svg" type="image/x-icon">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#27272a;" media="(prefers-color-scheme: dark)">
    <meta name="background-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="background-color" content="#27272a;" media="(prefers-color-scheme: dark)">
</head>

<body>
    <header>
        <h1>Monologue</h1>
        <button id="StartCreatePost">+</button>
    </header>
    <main>

        <div id="popup">
            <div class="popupContent">
                <textarea id="postIn"></textarea>
                <div>
                    <button id="postBtn">Post</button>
                    <button id="imageBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="20" height="20">
                            <path fill="currentColor"
                                d="M64 80c-8.8 0-16 7.2-16 16l0 320c0 8.8 7.2 16 16 16l320 0c8.8 0 16-7.2 16-16l0-320c0-8.8-7.2-16-16-16L64 80zM0 96C0 60.7 28.7 32 64 32l320 0c35.3 0 64 28.7 64 64l0 320c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64L0 96zm128 32a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm136 72c8.5 0 16.4 4.5 20.7 11.8l80 136c4.4 7.4 4.4 16.6 .1 24.1S352.6 384 344 384l-240 0c-8.9 0-17.2-5-21.3-12.9s-3.5-17.5 1.6-24.8l56-80c4.5-6.4 11.8-10.2 19.7-10.2s15.2 3.8 19.7 10.2l17.2 24.6 46.5-79c4.3-7.3 12.2-11.8 20.7-11.8z" />
                            w
                        </svg>
                    </button>
                    <input type="file" id="imageInput" accept="image/*">
                    <button id="close">Close</button>
                </div>
            </div>
        </div>
        <div id="feed"></div>

        <div id="hamburgerMenu">
            <button id="copy">Copy</button>
            <button id="edit">Edit</button>
            <button id="remove">Remove</button>
        </div>

    </main>
    <script src="/index.js"></script>
    <script>
        if (typeof navigator.serviceWorker !== 'undefined') {
            navigator.serviceWorker.register('sw.js')
        }
    </script>

</body>

</html>
